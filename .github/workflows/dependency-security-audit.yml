name: Dependency security audit

on:
  push:
    branches: [fix/security-dependencies-2026-11-22]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Report vulnerabilities and actionable fix ranges
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const a = require('./audit.json');
          console.log('COUNTS', JSON.stringify(a.metadata?.vulnerabilities));
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            console.log(JSON.stringify({name,severity:v.severity,range:v.range,isDirect:v.isDirect,fixAvailable:v.fixAvailable,via:v.via.filter(x=>typeof x==='object').map(x=>({name:x.name,title:x.title,url:x.url,range:x.range}))}));
          }
          NODE
      - name: Enforce zero high or critical vulnerabilities
        run: npm audit --audit-level=high
